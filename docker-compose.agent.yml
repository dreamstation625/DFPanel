# DFPanel Agent 部署（同一容器可同时托管 frps 与 frpc）
# 启动：docker compose -f docker-compose.agent.yml up -d
# 令牌请在面板「客户端节点 / Agent」页面创建后复制，或直接用面板生成的 docker run 指令

services:
  dfpanel-agent:
    image: dreamstation625/dfpanel-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: dfpanel-agent
    restart: unless-stopped

    # host 网络最简单：frps 监听宿主端口、frpc 可直接穿透宿主服务
    # bridge 模式请把隧道的 localIP 填成 host.docker.internal 或宿主内网 IP
    network_mode: host

    environment:
      DFPANEL_URL: "http://192.168.1.10:7226"
      DFPANEL_NODE_KEY: "在此粘贴 nodeKey"
      DFPANEL_NODE_SECRET: "在此粘贴 secret"
      # 角色：frps / frpc / frps,frpc
      DFPANEL_ROLES: "frps,frpc"
      # process = 容器内直接跑 frps/frpc 子进程（默认）；docker = 用 docker CLI 起容器
      # 两种运行时的 frp 二进制都由面板下发，Agent 首次需要时自动下载
      DFPANEL_RUNTIME: "process"
      TZ: "Asia/Shanghai"

    volumes:
      # DFPANEL_RUNTIME=docker：数据目录必须用宿主机路径 —— frp 容器要 bind-mount Agent
      # 容器里的配置与 frp 二进制，宿主机的 docker daemon 得直接看得见这些文件；
      # 命名卷在宿主机上没有对应路径，挂不进去。同时挂上 docker.sock：
      # - /opt/dfpanel-agent:/var/lib/dfpanel-agent
      # - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/var/lib/dfpanel-agent

volumes:
  agent-data:
