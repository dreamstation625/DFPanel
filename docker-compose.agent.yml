# DFPanel Agent 部署（一个容器只托管一个 frps 或 frpc）
# 启动：docker compose -f docker-compose.agent.yml up -d
# 先在 .env 设置 DFPANEL_NODE_KEY、DFPANEL_NODE_SECRET 和 DFPANEL_ROLES；每个 Agent 使用独立 nodeKey。

services:
  dfpanel-agent:
    image: dreamstation625/dfpanel-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: dfpanel-agent-${DFPANEL_NODE_KEY:?set_node_key}
    restart: unless-stopped

    # host 网络最简单：frps 监听宿主端口、frpc 可直接穿透宿主服务
    # bridge 模式请把隧道的 localIP 填成 host.docker.internal 或宿主内网 IP
    network_mode: host

    environment:
      DFPANEL_URL: "http://192.168.1.10:7226"
      DFPANEL_NODE_KEY: ${DFPANEL_NODE_KEY:?set_node_key}
      DFPANEL_NODE_SECRET: ${DFPANEL_NODE_SECRET:?set_node_secret}
      # 类型只能是 frps 或 frpc
      DFPANEL_ROLES: ${DFPANEL_ROLES:-frpc}
      # process = 容器内直接跑 frps/frpc 子进程（默认）；docker = 用 docker CLI 起容器
      # 两种运行时的 frp 二进制都由面板下发，Agent 首次需要时自动下载
      DFPANEL_RUNTIME: "process"
      TZ: "Asia/Shanghai"

    volumes:
      - /opt/dfpanel-agent/${DFPANEL_NODE_KEY:?set_node_key}:/var/lib/dfpanel-agent
      - /etc/machine-id:/host/etc/machine-id:ro
      # DFPANEL_RUNTIME=docker 时启用：
      # - /var/run/docker.sock:/var/run/docker.sock
