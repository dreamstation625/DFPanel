name: Docker

# dev 自动发布 pre；main 合并后发布正式版。tag 不触发发布。
# VERSION / VERSION.agent 保存正式目标版本，dev 自动附加提交标识。

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 版本检查与编译
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      agent_version: ${{ steps.ver.outputs.agent_version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      latest: ${{ steps.ver.outputs.latest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查发布策略
        run: node --test .github/scripts/release-version.test.cjs

      - name: 读取分支对应版本并拒绝覆盖其它提交
        id: ver
        run: node .github/scripts/release-version.cjs

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 生成前端占位目录（go:embed 需要 dist 存在）
        run: mkdir -p web/dist && touch web/dist/index.html

      - name: 编译（注入版本号）
        run: |
          go build -trimpath \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }} -X dfpanel/internal/agent.Version=${{ steps.ver.outputs.agent_version }}" \
            ./...

      - name: 回归测试
        run: go test ./...

      - name: 静态检查
        run: go vet ./...

      - name: 安装前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: 前端类型检查
        working-directory: web
        run: npm run type-check

      - name: 前端生产构建
        working-directory: web
        run: npm run build

  panel:
    name: 面板镜像
    needs: verify
    runs-on: ubuntu-latest
    # 兜底：镜像构建正常在 10 分钟内完成，超时说明卡死，及时失败而不是挂满 6 小时
    timeout-minutes: 45
    environment: DOCKERHUB
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/dfpanel
          # latest 由 verify 任务判定（仅正式版本），这里关闭自动生成
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=pre,enable=${{ needs.verify.outputs.prerelease }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.latest }}
          labels: |
            org.opencontainers.image.title=DFPanel
            org.opencontainers.image.description=frp 可视化控制面板（面板与 frps/frpc 分离部署）
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PANEL_VERSION=${{ needs.verify.outputs.version }}
            AGENT_VERSION=${{ needs.verify.outputs.agent_version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel

  agent:
    name: Agent 镜像
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: DOCKERHUB
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/dfpanel-agent
          # latest 由 verify 任务判定（仅正式版本），这里关闭自动生成
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.agent_version }}
            type=raw,value=pre,enable=${{ needs.verify.outputs.prerelease }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.latest }}
          labels: |
            org.opencontainers.image.title=DFPanel Agent
            org.opencontainers.image.description=DFPanel 单实例托管 Agent（frps 或 frpc）
            org.opencontainers.image.version=${{ needs.verify.outputs.agent_version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          build-args: |
            AGENT_VERSION=${{ needs.verify.outputs.agent_version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
