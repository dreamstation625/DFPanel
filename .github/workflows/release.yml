name: Release

# dev 自动发布 pre；main 合并后发布正式版。tag 不触发发布。
# VERSION / VERSION.agent 保存正式目标版本，dev 自动附加提交标识。

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # 发布流程不取消进行中的任务，避免上传一半的产物
  cancel-in-progress: false

jobs:
  verify:
    name: 版本检查与编译
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      agent_version: ${{ steps.ver.outputs.agent_version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查发布策略
        run: node --test .github/scripts/release-version.test.cjs

      - name: 读取分支对应版本并拒绝覆盖其它提交
        id: ver
        run: node .github/scripts/release-version.cjs

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 生成前端占位目录（go:embed 需要 dist 存在）
        run: mkdir -p web/dist && touch web/dist/index.html

      - name: 编译（注入版本号）
        run: |
          go build -trimpath \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }} -X dfpanel/internal/agent.Version=${{ steps.ver.outputs.agent_version }}" \
            ./...

      - name: 回归测试
        run: go test ./...

      - name: 静态检查
        run: go vet ./...

  web:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: 前端类型检查
        working-directory: web
        run: npm run type-check

      - name: 编译前端
        working-directory: web
        run: npm run build

      # 所有平台共用同一份静态产物，避免每个矩阵任务重复跑 vite build
      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build:
    name: 编译 ${{ matrix.os }}/${{ matrix.arch }}
    needs: [verify, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 编译并打包
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          AGENT_VERSION: ${{ needs.verify.outputs.agent_version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          EXT=""
          [ "$TARGET_OS" = "windows" ] && EXT=".exe"

          NAME="dfpanel-${VERSION}-${TARGET_OS}-${TARGET_ARCH}"
          OUT="dist/${NAME}"
          mkdir -p "$OUT"

          # 面板：前端已通过 go:embed 打进二进制，单文件分发
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath \
            -ldflags "-X main.version=${VERSION}" \
            -o "${OUT}/dfpanel${EXT}" .

          # Agent：版本取自 VERSION.agent，与面板版本彼此独立
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath \
            -ldflags "-X dfpanel/internal/agent.Version=${AGENT_VERSION}" \
            -o "${OUT}/dfpanel-agent${EXT}" ./cmd/agent

          cp README.md LICENSE "${OUT}/"

          cd dist
          if [ "$TARGET_OS" = "windows" ]; then
            zip -qr "${NAME}.zip" "${NAME}"
            ARCHIVE="${NAME}.zip"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          fi
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "产物：${ARCHIVE}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dfpanel-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  agent_bundle:
    name: Agent 全平台包
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 构建并校验全平台 Agent
        env:
          PANEL_VERSION: ${{ needs.verify.outputs.version }}
          AGENT_VERSION: ${{ needs.verify.outputs.agent_version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PANEL_VERSION" > VERSION
          printf '%s\n' "$AGENT_VERSION" > VERSION.agent
          mkdir -p dist
          ARCHIVE="dfpanel-agent-bundle-${PANEL_VERSION}.tar.gz"
          go run ./cmd/agentbundle -output "dist/${ARCHIVE}"
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bundle
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: 发布 Release
    needs: [verify, build, agent_bundle]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: dfpanel-*
          merge-multiple: true

      - name: 下载 Agent 全平台包
        uses: actions/download-artifact@v4
        with:
          name: agent-bundle
          path: assets

      - name: 汇总校验值
        run: |
          set -euo pipefail
          cd assets
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -lh

      - name: 创建/更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          # 发布 tag 固定指向本次源码；dev 不占用 Latest。
          target_commitish: ${{ github.sha }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'false' }}
          prerelease: ${{ needs.verify.outputs.prerelease }}
          # 依据上一个 Release 之间的提交自动生成更新日志
          generate_release_notes: true
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/checksums.txt
          fail_on_unmatched_files: true
