# DFPanel 面板一体化部署（面板 + 内置 frps）
# 启动：docker compose up -d
# 面板地址：http://<宿主IP>:8080

services:
  dfpanel:
    image: dfpanel/panel:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfpanel
    restart: unless-stopped

    # Linux 推荐 host 网络：frps 的 7000 / dashboard 7500 / vhost 80,443 无需逐个映射
    # Windows / macOS 的 Docker 桌面版不支持 host 网络，请注释掉 network_mode 并启用下面的 ports
    network_mode: host
    # ports:
    #   - "8080:8080"   # 面板
    #   - "7000:7000"   # frps 主端口
    #   - "7500:7500"   # frps dashboard
    #   - "80:80"       # vhost HTTP
    #   - "443:443"     # vhost HTTPS

    volumes:
      - ./data:/data
    environment:
      DFPANEL_LISTEN: ":8080"
      DFPANEL_DATA_DIR: "/data"
      # 面板对外地址：用于生成 Agent 安装命令与 frpc 的 serverAddr，务必改成实际可访问地址
      DFPANEL_PUBLIC_URL: "http://192.168.1.10:8080"
      TZ: "Asia/Shanghai"
